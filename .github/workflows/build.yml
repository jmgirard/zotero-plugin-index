name: Build data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time on each branch. A run that starts while another runs waits for it,
# and a newer waiting run replaces an older one. Runs on other branches cannot deploy,
# so they do not wait on main's runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The time limits in src/build/build.ts end the plugin reads at 18 minutes,
    # which leaves time for the other steps before this limit.
    timeout-minutes: 30
    # `pnpm build` reads the closed report issues to count the reports.
    permissions:
      contents: read
      issues: read
    # This job restores and saves no Actions cache. The read job of `Discover plugins`
    # reads repos that anyone can tag, and its scheduled and dispatched runs can save
    # caches that a run on the default branch restores. A dependency store planted there
    # could be restored into this job before `pnpm install`, and this job writes the site
    # and data that Pages publishes. GitHub enforces this mode with the job's cache token.
    cache-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No dependency cache, as `cache-mode` above says.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Exits 1 when more than half of the records carry a build-level failure, such as
      # a rate limit or a network error (README "Building the data" lists them), and
      # when every record carries a failure of any name, and when it cannot read the
      # report issues. The steps below without an `if:` are then skipped, so nothing is
      # deployed.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Writes the site pages into dist/ beside the data. A failed site build also
      # deploys nothing.
      - run: pnpm site
      # Kept after a failed build too, so the failures can be read. Skipped when no data
      # file exists, for example after a failed `pnpm check`.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('dist/v1/plugins.json') != '' }}
        with:
          name: plugins-data
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
