name: Merge bot pull requests

# Before the daily build at 06:17 UTC, so a plugin merged here is in that day's site.
on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:

# The job sets its own permissions.
permissions: {}

# In the discover group, so a merge never runs while a discover or issue run reads the
# bot pull requests or pushes a discover/ branch. With `queue: max`, up to 100 runs wait
# in the group and run one at a time, in an order GitHub does not promise.
concurrency:
  group: discover
  cancel-in-progress: false
  queue: max

jobs:
  merge:
    # The entries the merge checks against come from the checkout, so a dispatch on
    # another branch or a tag does nothing.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job merges pull requests, so it restores and saves no Actions cache, like the
    # job of `Close the issue of a closed bot pull request`.
    cache-mode: none
    # A merge made with this token starts no workflow run.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The token reaches only `pnpm merge-discover`, through its environment.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # No dependency cache, as `cache-mode` above says.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm merge-discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
