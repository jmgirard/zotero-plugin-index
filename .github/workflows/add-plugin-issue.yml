name: Add a plugin from an issue

on:
  issues:
    types: [opened]
  # A daily sweep answers the "Add a plugin" issues that no run answered, such as one
  # whose run failed before its comment, or whose run GitHub canceled because 100 runs
  # were already waiting in the group. 02:43 UTC is 12 hours from `Discover plugins`,
  # so a sweep seldom waits for a discover run in the group.
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

# Each job sets its own permissions. The pick job names the issues and reads no plugin
# repo. The read job reads the repos that the issues name, so it cannot write; the write
# job pushes, opens the pull requests, and answers the issues from the read job's
# handoff, and reads no plugin repo itself.
permissions: {}

# The group that `Discover plugins` uses, so a run here and a discover run never push
# the same branch at once. With `queue: max`, up to 100 runs wait in the group and run
# one at a time, in an order GitHub does not promise; GitHub cancels runs past that,
# and a later sweep can answer such a run's issue while it is at most 7 days old.
# A run whose pick job skips, for an issue without the label `add-plugin` or a dispatch
# from another branch or a tag, takes a group of its own and waits for no run.
concurrency:
  group: ${{ (github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'add-plugin') || github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) && format('add-plugin-skipped-{0}', github.run_id) || 'discover' }}
  cancel-in-progress: false
  queue: max

jobs:
  pick:
    # Issues opened from .github/ISSUE_TEMPLATE/add-plugin.yml carry the label
    # `add-plugin`. A user with write access can also set it when they open an issue. A
    # sweep runs on the schedule, or dispatched from the default branch.
    if: (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'add-plugin')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: none
    # The sweep reads the issues, their comments, and the runs of this workflow, so it
    # picks no issue whose run is still on its way.
    permissions:
      contents: read
      issues: read
      actions: read
    # The issue numbers, separated by spaces, or empty when there is none.
    outputs:
      issues: ${{ steps.event.outputs.issues || steps.sweep.outputs.issues }}
    steps:
      - id: event
        if: github.event_name == 'issues'
        run: echo "issues=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
      - if: github.event_name != 'issues'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: github.event_name != 'issues'
        uses: pnpm/action-setup@v6
      # No dependency cache, as `cache-mode` above says.
      - if: github.event_name != 'issues'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: github.event_name != 'issues'
        run: pnpm install --frozen-lockfile
      # The command prints one number per line, and a failed read fails the step.
      - id: sweep
        if: github.event_name != 'issues'
        run: |
          issues=$(pnpm --silent unanswered-issues --label add-plugin --workflow add-plugin-issue.yml --limit 3)
          echo "issues=$(echo $issues)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  read:
    needs: pick
    if: needs.pick.outputs.issues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job reads repos that anyone can name, so it restores and saves no Actions
    # cache, which a scheduled run could otherwise save for the default branch.
    cache-mode: none
    permissions:
      contents: read
      pull-requests: read
      issues: read
    # Empty when this attempt uploaded no handoff, so the write job never reads an
    # earlier attempt's.
    outputs:
      handoff: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # No dependency cache, as `cache-mode` above says.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # The command reads each issue's body from the API, so only the issue numbers reach
      # it, and no text from an issue enters a shell script. Each issue gets its own
      # handoff directory, and one failed issue does not stop the rest.
      - run: |
          status=0
          for issue in $ISSUES; do
            ISSUE_NUMBER="$issue" pnpm discover-issue --handoff "handoff/$issue" || status=1
          done
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUES: ${{ needs.pick.outputs.issues }}
      # Also after a failed step that left a plan, such as a failed state write. A re-run
      # replaces the first attempt's handoff.
      - id: upload
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('handoff/*/plan.json') != '' }}
        with:
          name: handoff
          path: handoff/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  write:
    needs: [pick, read]
    # Also after a failed read job, so each issue gets an answer; not when the read job
    # was skipped, which is every run with no issue.
    if: always() && needs.read.result != 'skipped'
    runs-on: ubuntu-latest
    # Each of up to 3 issues can take about 30 minutes in `pnpm propose`: for one entry,
    # `fetchBase` and `propose` in src/discover/propose.ts run 12 git processes, each
    # stopped at 2 minutes, then `pnpm check`, stopped at 5, after a 30-second
    # branch-name check.
    timeout-minutes: 90
    # This job comments on and closes issues, so it restores and saves no Actions cache.
    cache-mode: none
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The token reaches git only in `pnpm propose`, through its environment.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # A failed read job can leave no handoff; `pnpm propose` then says so on the issue.
      - uses: actions/download-artifact@v8
        if: ${{ needs.read.outputs.handoff != '' }}
        continue-on-error: true
        with:
          name: handoff
          path: handoff
      # One issue at a time, in the pick job's order, and one failed issue does not stop
      # the rest. A rerun of this job answers each issue again.
      - run: |
          status=0
          for issue in $ISSUES; do
            ISSUE_NUMBER="$issue" pnpm propose "handoff/$issue" || status=1
          done
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUES: ${{ needs.pick.outputs.issues }}
