name: Discover plugins

on:
  schedule:
    - cron: "43 14 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: The most pull requests the run opens
        type: number
        default: 5

# Pushes the discover/ branches and opens their pull requests. A pull request opened
# with this token starts no workflow run, so its body carries the check result.
permissions:
  contents: write
  pull-requests: write

# One run at a time, so two runs cannot propose the same plugin.
concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    # The index and the code come from the checkout, and the pull requests are based on
    # the default branch, so a dispatch on another branch does nothing.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A cache key cannot be written twice, so each run saves the state under its own
      # key, and the next run restores the newest one by the prefix.
      - uses: actions/cache/restore@v6
        with:
          path: .cache/discovery-state.json
          key: discovery-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discovery-state-
      # Scheduled runs have no inputs, so LIMIT is empty and the command's default of 5
      # applies. A dispatched limit reaches the command as given, so 0 is refused.
      - run: pnpm discover --propose ${LIMIT:+--limit "$LIMIT"}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ inputs.limit }}
      # Saved after a failed run too: the state records repos that were refused.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .cache/discovery-state.json
          key: discovery-state-${{ github.run_id }}-${{ github.run_attempt }}
