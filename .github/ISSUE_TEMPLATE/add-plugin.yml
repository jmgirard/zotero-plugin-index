name: Add a plugin
description: Propose a Zotero 7 plugin for the index by its GitHub repository.
title: Add a plugin
labels: ["add-plugin"]
body:
  - type: markdown
    attributes:
      value: |
        A bot reads the repository and its newest stable release with an
        `.xpi` file. It reads the newest prerelease instead if no stable
        release has an `.xpi` file, or if that stable release is not a
        Zotero 7+ build and a newer prerelease has one.
        If the plugin passes the inclusion bar, the bot opens a pull request
        that adds its entry, and it comments the link here. If the plugin does
        not pass, or the index already has it, the bot comments the reason and
        closes this issue.
  # src/discover/issue.ts finds the URL under this label's heading in the issue body.
  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      description: The GitHub repository of the plugin.
      placeholder: https://github.com/<owner>/<repo>
    validations:
      required: true
